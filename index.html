<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FreeDogMatch — Прогнозы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0c10; font-family: Arial, sans-serif; color: #e5e7eb; padding: 2rem; }
        .container { max-width: 600px; margin: 0 auto; background: #0f1117; padding: 2rem; border-radius: 32px; }
        input, textarea { width: 100%; margin: 10px 0; padding: 12px; background: #03060b; border: 1px solid #2b303d; border-radius: 20px; color: white; }
        button { background: #1f3320; padding: 12px 28px; border: none; border-radius: 40px; color: white; cursor: pointer; }
        .telegram { margin-bottom: 1rem; }
        .telegram a { color: #b5ff8f; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="telegram"><a href="https://t.me/rekvz" target="_blank">📱 Связаться с нами</a></div>
    <h1>FreeDogMatch</h1>
    <form id="form">
        <input type="text" id="name" placeholder="Ваше имя" required>
        <input type="email" id="email" placeholder="Ваш email" required>
        <textarea id="message" rows="4" placeholder="Прогноз" required></textarea>
        <button type="submit" id="btn">Отправить</button>
    </form>
    <div id="status"></div>
</div>
<script>
    const form = document.getElementById('form');
    const statusDiv = document.getElementById('status');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        statusDiv.innerHTML = '⏳ Отправка...';
        
        const data = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
        };
        
        try {
            const res = await fetch('https://getform.io/f/bjjyjzxa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                statusDiv.innerHTML = '✅ Прогноз отправлен!';
                form.reset();
            } else {
                statusDiv.innerHTML = '❌ Ошибка. Попробуйте позже.';
            }
        } catch (err) {
            statusDiv.innerHTML = '❌ Ошибка. Напишите в Telegram.';
        }
        btn.disabled = false;
        setTimeout(() => statusDiv.innerHTML = '', 5000);
    });
</script>
</body>
</html>
